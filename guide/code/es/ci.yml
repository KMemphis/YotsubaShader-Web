name: build
on: [push, pull_request]

jobs:
  shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # El generador de código compila cada shader durante la compilación
      - run: dotnet build -c Release

      # Las pruebas unitarias no necesitan GPU
      - run: dotnet test -c Release --no-build

      # Valida el SPIR-V que produjo la compilación
      - run: |
          sudo apt-get update && sudo apt-get install -y spirv-tools
          yotsuba compile src/MyEngine.Shaders/MyEngine.Shaders.csproj \
            --target spirv --output artifacts/shaders
          for f in artifacts/shaders/*.spv; do spirv-val "$f"; done
