<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect width="720" height="250" rx="16" fill="#14141c"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a0a0b4"/></marker></defs><text x="360" y="40" font-size="17" fill="#f2f2f7" text-anchor="middle" font-weight="700">A uniform is data your program sends to the shader</text><rect x="40" y="80" width="220" height="110" rx="10" fill="#3a2a14" stroke="#ffb454" stroke-width="2"/><text x="150" y="115" font-size="16" fill="#f2f2f7" text-anchor="middle" font-weight="700">Your program (CPU)</text><text x="150" y="142" font-size="13" fill="#a0a0b4" text-anchor="middle" font-weight="400">Every frame:</text><text x="150" y="164" font-size="14" fill="#f2f2f7" text-anchor="middle" font-weight="400">Seconds = 3.25</text><line x1="270" y1="135" x2="440" y2="135" stroke="#a0a0b4" stroke-width="2.5" marker-end="url(#a)"/><text x="355" y="122" font-size="14" fill="#5ad1ff" text-anchor="middle" font-weight="700">Clock</text><rect x="450" y="80" width="230" height="110" rx="10" fill="#1e1e2a" stroke="#b98cff" stroke-width="2"/><text x="565" y="115" font-size="16" fill="#f2f2f7" text-anchor="middle" font-weight="700">Your shader (GPU)</text><text x="565" y="142" font-size="13" fill="#a0a0b4" text-anchor="middle" font-weight="400">Every pixel reads</text><text x="565" y="164" font-size="14" fill="#f2f2f7" text-anchor="middle" font-weight="400">Time.Seconds</text><text x="360" y="225" font-size="14" fill="#a0a0b4" text-anchor="middle" font-weight="400">The shader can read it, but not change it.</text></svg>
