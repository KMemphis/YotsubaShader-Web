<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 370" width="750" height="370" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img"><rect width="750" height="370" rx="16" fill="#14141c"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a0a0b4"/></marker></defs><text x="375" y="34" font-size="18" fill="#f2f2f7" text-anchor="middle" font-weight="700">What a game does, in order</text><text x="375" y="66" font-size="12.5" fill="#8a8aa0" text-anchor="middle" font-weight="600">Once, at the start</text><rect x="24" y="80" width="190" height="76" rx="10" fill="#2a1e3a" stroke="#b98cff" stroke-width="2"/><text x="119.0" y="114.0" font-size="16" fill="#f2f2f7" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">Run()</text><text x="119.0" y="136.0" font-size="12.5" fill="#a0a0b4" text-anchor="middle">Program.cs starts it</text><line x1="220" y1="118" x2="274" y2="118" stroke="#a0a0b4" stroke-width="2.5" marker-end="url(#a)"/><rect x="280" y="80" width="190" height="76" rx="10" fill="#1e1e2a" stroke="#3a3a4c" stroke-width="2"/><text x="375.0" y="114.0" font-size="16" fill="#f2f2f7" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">Initialize()</text><text x="375.0" y="136.0" font-size="12.5" fill="#a0a0b4" text-anchor="middle">not used here</text><line x1="476" y1="118" x2="530" y2="118" stroke="#a0a0b4" stroke-width="2.5" marker-end="url(#a)"/><rect x="536" y="80" width="190" height="76" rx="10" fill="#14301f" stroke="#6ee7a0" stroke-width="2"/><text x="631.0" y="114.0" font-size="16" fill="#f2f2f7" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">LoadContent()</text><text x="631.0" y="136.0" font-size="12.5" fill="#a0a0b4" text-anchor="middle">you create the Effect here</text><path d="M631 160 V176 H155 V212" fill="none" stroke="#a0a0b4" stroke-width="2.5" marker-end="url(#a)"/><rect x="24" y="190" width="540" height="160" rx="12" fill="none" stroke="#3a3a4c" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="60" y="214" width="190" height="64" rx="10" fill="#3a2a14" stroke="#ffb454" stroke-width="2"/><text x="155.0" y="242.0" font-size="16" fill="#f2f2f7" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">Update()</text><text x="155.0" y="264.0" font-size="12.5" fill="#a0a0b4" text-anchor="middle">logic: keys, movement</text><line x1="256" y1="246" x2="332" y2="246" stroke="#a0a0b4" stroke-width="2.5" marker-end="url(#a)"/><rect x="338" y="214" width="190" height="64" rx="10" fill="#12303a" stroke="#5ad1ff" stroke-width="2"/><text x="433.0" y="242.0" font-size="16" fill="#f2f2f7" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,monospace">Draw()</text><text x="433.0" y="264.0" font-size="12.5" fill="#a0a0b4" text-anchor="middle">you draw the rectangle here</text><path d="M433 282 C433 314 155 314 155 284" fill="none" stroke="#a0a0b4" stroke-width="2.5" marker-end="url(#a)"/><text x="294" y="338" font-size="12.5" fill="#8a8aa0" text-anchor="middle" font-weight="600">Every frame (about 60 times per second)</text><line x1="568" y1="246" x2="596" y2="246" stroke="#a0a0b4" stroke-width="2.5" marker-end="url(#a)"/><rect x="600" y="214" width="130" height="64" rx="10" fill="#1e1e2a" stroke="#3a3a4c" stroke-width="2"/><text x="665.0" y="242.0" font-size="16" fill="#f2f2f7" text-anchor="middle" font-weight="700">End</text><text x="665.0" y="264.0" font-size="12.5" fill="#a0a0b4" text-anchor="middle">window closes</text></svg>