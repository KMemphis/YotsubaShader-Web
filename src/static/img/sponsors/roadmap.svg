<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sponsor roadmap board</title>
  <desc id="desc">A project board with planned, in progress and released columns, including a Metal backend sponsor vote.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="54" fill="#010409"/>
  <circle cx="29" cy="27" r="12" fill="#f5f5f7"/>
  <path d="M23 27h12M29 21v12" stroke="#0d1117" stroke-width="2" stroke-linecap="round"/>
  <text x="52" y="33" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650">Yotsuba Shader</text>
  <text x="182" y="33" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Sponsor roadmap</text>
  <rect x="788" y="15" width="144" height="28" rx="7" fill="#21262d" stroke="#30363d"/>
  <text x="809" y="34" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">View as board</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(24 82)">
      <circle cx="8" cy="8" r="6" fill="#8b949e"/><text x="22" y="14" fill="#f0f3f6" font-size="15" font-weight="650">Planned</text><text x="103" y="14" fill="#8b949e" font-size="13">3</text>
      <rect x="0" y="36" width="285" height="170" rx="12" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
      <rect x="18" y="55" width="94" height="24" rx="12" fill="#3b1f32"/><circle cx="34" cy="67" r="4" fill="#fa679f"/><text x="45" y="71" fill="#ff8fba" font-size="11" font-weight="650">SPONSOR VOTE</text>
      <text x="18" y="108" fill="#f0f3f6" font-size="19" font-weight="650">Metal backend</text>
      <text x="18" y="134" fill="#8b949e" font-size="13">Native output for Apple platforms</text>
      <rect x="18" y="155" width="78" height="24" rx="12" fill="#122b27" stroke="#1f6f63"/><text x="35" y="171" fill="#62f0d0" font-size="11" font-weight="650">Vote next</text>
      <rect x="0" y="220" width="285" height="104" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="252" fill="#f0f3f6" font-size="15" font-weight="600">Godot integration</text><text x="18" y="279" fill="#8b949e" font-size="12">Import compiled shader binaries</text>
    </g>
    <g transform="translate(337 82)">
      <circle cx="8" cy="8" r="6" fill="#d29922"/><text x="22" y="14" fill="#f0f3f6" font-size="15" font-weight="650">In progress</text><text x="111" y="14" fill="#8b949e" font-size="13">2</text>
      <rect x="0" y="36" width="285" height="142" rx="12" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
      <rect x="18" y="55" width="66" height="22" rx="11" fill="#2a2515"/><text x="32" y="70" fill="#e3b341" font-size="11" font-weight="650">COMPILER</text>
      <text x="18" y="106" fill="#f0f3f6" font-size="17" font-weight="650">Source generator pipeline</text>
      <text x="18" y="132" fill="#8b949e" font-size="12">Emit binaries during build</text>
      <rect x="0" y="192" width="285" height="118" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="226" fill="#f0f3f6" font-size="15" font-weight="600">Backend diagnostics</text><text x="18" y="252" fill="#8b949e" font-size="12">Report unsupported features in the IDE</text><rect x="18" y="270" width="126" height="6" rx="3" fill="#30363d"/><rect x="18" y="270" width="82" height="6" rx="3" fill="#d29922"/>
    </g>
    <g transform="translate(650 82)">
      <circle cx="8" cy="8" r="6" fill="#3fb950"/><text x="22" y="14" fill="#f0f3f6" font-size="15" font-weight="650">Released</text><text x="91" y="14" fill="#8b949e" font-size="13">4</text>
      <rect x="0" y="36" width="285" height="120" rx="12" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
      <rect x="18" y="55" width="58" height="22" rx="11" fill="#15301b"/><text x="34" y="70" fill="#56d364" font-size="11" font-weight="650">DONE</text>
      <text x="18" y="106" fill="#f0f3f6" font-size="16" font-weight="650">Five syntax packages</text>
      <text x="18" y="132" fill="#8b949e" font-size="12">HLSL · GLSL · MSL · SPIR-V · WGSL</text>
      <rect x="0" y="170" width="285" height="102" rx="12" fill="#161b22" stroke="#30363d"/>
      <text x="18" y="204" fill="#f0f3f6" font-size="15" font-weight="600">Roslyn shader discovery</text><text x="18" y="230" fill="#8b949e" font-size="12">Find stages by symbol, not text</text>
    </g>
  </g>
</svg>
