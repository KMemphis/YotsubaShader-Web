<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Yotsuba Shader engine integration</title>
  <desc id="desc">A technical pipeline connecting a C Sharp shader to SPIR-V, an engine integration layer and the GPU.</desc>
  <defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fa679f"/><stop offset="1" stop-color="#62f0d0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="960" height="540" fill="#0b0b0c"/>
  <g opacity=".35" stroke="#2c2c2e" stroke-width="1"><path d="M0 90h960M0 180h960M0 270h960M0 360h960M0 450h960M120 0v540M240 0v540M360 0v540M480 0v540M600 0v540M720 0v540M840 0v540"/></g>
  <text x="64" y="66" fill="#f5f5f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="650">Dedicated integration session</text><text x="64" y="91" fill="#86868b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">From shader source to a binary your renderer can load</text>
  <path d="M190 276H292M428 276H526M678 276H770" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/><path d="M282 268l12 8-12 8M516 268l12 8-12 8M760 268l12 8-12 8" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="54" y="184" width="136" height="184" rx="20" fill="#171719" stroke="#3a3a3c"/><rect x="76" y="208" width="92" height="30" rx="8" fill="#30202a"/><text x="122" y="228" text-anchor="middle" fill="#fa679f" font-size="12" font-weight="700">C# SHADER</text><text x="78" y="272" fill="#f5f5f7" font-size="14" font-weight="650">[ShaderStage]</text><text x="78" y="298" fill="#a1a1a6" font-size="12">Vertex()</text><text x="78" y="320" fill="#a1a1a6" font-size="12">Fragment()</text><text x="78" y="342" fill="#a1a1a6" font-size="12">Your types</text>
    <rect x="294" y="184" width="136" height="184" rx="20" fill="#171719" stroke="#3a3a3c"/><circle cx="362" cy="232" r="27" fill="#242426"/><path d="M347 232h30M362 217v30" stroke="#fa679f" stroke-width="2"/><text x="362" y="286" text-anchor="middle" fill="#f5f5f7" font-size="17" font-weight="700">SPIR-V</text><text x="362" y="313" text-anchor="middle" fill="#a1a1a6" font-size="12">Validated binary</text><text x="362" y="337" text-anchor="middle" fill="#62f0d0" font-family="'SFMono-Regular',Consolas,monospace" font-size="11">shader.spv</text>
    <rect x="528" y="166" width="152" height="220" rx="20" fill="#171719" stroke="#3a3a3c"/><rect x="551" y="191" width="106" height="42" rx="10" fill="#14302b"/><text x="604" y="217" text-anchor="middle" fill="#62f0d0" font-size="12" font-weight="700">ENGINE API</text><text x="551" y="270" fill="#f5f5f7" font-size="14" font-weight="650">Load binary</text><text x="551" y="296" fill="#a1a1a6" font-size="12">Create pipeline</text><text x="551" y="320" fill="#a1a1a6" font-size="12">Bind resources</text><text x="551" y="344" fill="#a1a1a6" font-size="12">Draw / dispatch</text>
    <rect x="772" y="184" width="136" height="184" rx="20" fill="#171719" stroke="#3a3a3c"/><rect x="802" y="213" width="76" height="54" rx="10" fill="#242426" stroke="#62f0d0"/><path d="M814 227h52M814 240h52M814 253h52" stroke="#62f0d0" stroke-width="2" opacity=".8"/><text x="840" y="304" text-anchor="middle" fill="#f5f5f7" font-size="19" font-weight="700">GPU</text><text x="840" y="332" text-anchor="middle" fill="#a1a1a6" font-size="12">Render / compute</text>
  </g>
  <rect x="173" y="425" width="614" height="54" rx="27" fill="#151517" stroke="#2c2c2e"/><circle cx="205" cy="452" r="7" fill="#fa679f"/><text x="224" y="457" fill="#c7c7cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Your environment</text><text x="359" y="457" fill="#68686d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">·</text><text x="378" y="457" fill="#c7c7cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Your renderer</text><text x="485" y="457" fill="#68686d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">·</text><text x="504" y="457" fill="#c7c7cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">One integration path</text><circle cx="758" cy="452" r="7" fill="#62f0d0"/>
</svg>
