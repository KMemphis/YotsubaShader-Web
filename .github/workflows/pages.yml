name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://yotsubashader.com     # sin barra final

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # El build lee ../YotsubaShader.Language (referencia de atributos) y el playground compila
      # los proyectos del compilador, así que se necesitan al lado de Web/ (como en tu máquina).
      - name: Código del compilador
        uses: actions/checkout@v7
        with:
          repository: KMemphis/YotsubaShader
          token: ${{ secrets.MAIN_REPO_TOKEN || github.token }}
          sparse-checkout: |
            YotsubaShader.Language
            YotsubaShader.IR
            YotsubaShader.Compiler.SpirV
            YotsubaShader.Generator
            YotsubaShader.Roslyn

      - name: Esta web
        uses: actions/checkout@v7
        with:
          path: Web

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Si el compilador de la rama principal no compila en ese momento, la web se publica igual
      # (sin playground) y el build deja un aviso en lugar de fallar.
      - name: Construir el playground (compilador en WebAssembly)
        id: playground
        continue-on-error: true
        working-directory: Web
        run: npm run playground

      - name: Avisar si el playground no se pudo construir
        if: steps.playground.outcome == 'failure'
        run: echo "::warning title=Playground no construido::dotnet publish falló; la web se publica sin el compilador en el navegador. Revisa que YotsubaShader compile en main."

      - name: Construir la web
        working-directory: Web
        run: node build.mjs --strict-i18n   # falla si falta una traducción o hay un enlace roto

      - name: Comprobar SEO (sitemap, robots, canonical)
        working-directory: Web/dist
        run: |
          test -f sitemap.xml
          grep -q "^Sitemap: ${SITE_URL}/sitemap.xml" robots.txt
          grep -q "rel=\"canonical\" href=\"${SITE_URL}/\"" index.html

      - name: Comprobar el playground
        if: steps.playground.outcome == 'success'
        working-directory: Web/dist
        run: test -f playground-app/_framework/blazor.webassembly.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: Web/dist

  deploy:
    if: github.event_name != 'pull_request'   # los pull requests solo construyen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
